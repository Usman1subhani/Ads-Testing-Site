<body>
    <div class="container">
        <header>
            <h1>AdCash Instream Ads Test Project</h1>
            <p>Complete test environment for AdCash video ads integration</p>
        </header>
        <!-- <div>
            <script type="text/javascript">
                aclib.runBanner({
                    zoneId: '10724442',
                });
            </script>
        </div> -->

        <div id="awn-z10721318" ></div>


        <div class="test-controls">
            <div class="control-panel">
                <h3>Ad Configuration <span class="status-indicator status-inactive" id="adStatus">Ad Not Loaded</span>
                </h3>

                <div class="form-group">
                    <label for="adType">Ad Type</label>
                    <select id="adType">
                        <option value="instream">Instream (Pre-roll)</option>
                        <option value="midstream">Midstream</option>
                        <option value="poststream">Post-stream</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="zoneId">Zone ID</label>
                    <input type="text" id="zoneId" value="10717342" placeholder="Enter your Zone ID">
                </div>

                <div class="form-group">
                    <label for="vastUrl">VAST URL (Optional)</label>
                    <input type="text" id="vastUrl"
                        value="https://youradexchange.com/video/select.php?r=10717342&vast=4"
                        placeholder="Custom VAST URL">
                </div>

                <button class="btn" id="loadAdBtn">Load & Play Ad</button>
                <button class="btn btn-secondary" id="skipAdBtn">Skip Ad</button>
            </div>

            <div class="control-panel">
                <h3>Video Player Controls</h3>


                <div class="form-group">
                    <label for="videoSource">Test Video URL</label>
                    <input type="text" id="videoSource" value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
                        placeholder="Enter video stream URL">
                </div>

                <div class="video-controls">
                    <button class="btn" id="playBtn">Play Video</button>
                    <button class="btn btn-secondary" id="pauseBtn">Pause</button>
                    <button class="btn" id="testSequenceBtn">Test Full Sequence</button>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div style="margin-top: 15px;">
                    <button class="btn btn-danger" id="resetBtn">Reset All</button>
                </div>
            </div>
        </div>

        <div class="video-container">
            <div class="ad-info" id="adInfo"></div>
            <div class="ad-timer" id="adTimer"></div>
            <div class="loading hidden" id="loading">Loading Ad...</div>

            <video id="videoPlayer" controls playsinline webkit-playsinline></video>

            <div class="controls">
                <div class="ad-controls" id="adControls">
                    <button class="btn btn-secondary" id="volumeBtn">Mute/Unmute</button>
                    <button class="btn btn-secondary" id="fullscreenBtn">Fullscreen</button>
                </div>
            </div>
        </div>

        <div class="log-container">
            <h3>Debug Log</h3>
            <div id="log"></div>
            <button class="btn btn-secondary" style="margin-top: 10px;" id="clearLogBtn">Clear Log</button>
        </div>
    </div>

    <!-- AdCash Script (Official SDK) -->
